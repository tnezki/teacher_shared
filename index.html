<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Shared</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f6f8;color:#173f6d}
.wrap{max-width:900px;margin:48px auto;padding:0 20px}
h1{background:#173f6d;color:#fff;padding:20px;border-radius:14px;margin-bottom:8px}
.subtitle{color:#5c6d82;margin:0 0 24px;font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{display:block;background:#fff;border:2px solid #d9c06d;border-radius:14px;padding:24px;text-decoration:none;color:#173f6d;font-size:1.2rem;font-weight:800}
.card:hover{background:#fff8df}
.muted{color:#667085;font-size:.9rem;margin-top:24px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
<h1>Teacher Shared</h1>
<p class="subtitle">Hosted read-only co-teacher agendas and shared teacher resources.</p>
<div class="cards">
<a class="card" href="algebra/">Algebra 1</a>
<a class="card" href="physics/">Physics</a>
<a class="card" href="calc/">AP Calculus AB</a>
</div>
<p class="muted">Generated from the local Planners and published through the teacher_shared repository. Local Planner /shared/ pages are preview only.</p>
</div>
</body>
</html>
