<script>const data=[{"chapter": 1, "title": "Introduction and Probability", "sections": [{"section": "1.1.4", "title": "Investigating a Proportional Relationship", "target": "I can compare quantities using equivalent ratios without assuming a complete proportional model.", "stage": "READINESS", "rung": "Prerequisite", "families": [{"id": "CC2-AP1-1-1-4-T01-R01", "category": "reasoning", "prompt": "Two teams mix 2 cups of juice with 5 cups of water and 4 cups with 10 cups. Explain why their mixtures have the same ratio.", "answer": "The second mixture doubles each quantity; both juice-to-water ratios are 2:5."}, {"id": "CC2-AP1-1-1-4-T01-R02", "category": "reasoning", "prompt": "A student says 3:4 and 6:7 are equivalent because both numbers grow. Evaluate the claim.", "answer": "Not equivalent: doubling 3:4 gives 6:8, not 6:7."}, {"id": "CC2-AP1-1-1-4-T01-R03", "category": "reasoning", "prompt": "Explain whether 4 red tiles for every 6 blue tiles is the same ratio as 2 red tiles for every 3 blue tiles.", "answer": "Yes; divide both parts of 4:6 by 2."}, {"id": "CC2-AP1-1-1-4-T01-S01", "category": "direct", "prompt": "Fill in: 3:5 = 6:__ .", "answer": "10."}, {"id": "CC2-AP1-1-1-4-T01-S02", "category": "direct", "prompt": "Complete: 2 pencils cost $6; 4 pencils cost $__.", "answer": "12."}, {"id": "CC2-AP1-1-1-4-T01-S03", "category": "direct", "prompt": "Simplify the ratio 12:18.", "answer": "2:3."}, {"id": "CC2-AP1-1-1-4-T01-P01", "category": "spiral", "prompt": "Find two factors of 24 with product 24 and sum 10.", "answer": "4 and 6."}, {"id": "CC2-AP1-1-1-4-T01-P02", "category": "spiral", "prompt": "Compute 3 × 8 + 4.", "answer": "28."}, {"id": "CC2-AP1-1-1-4-T01-P03", "category": "spiral", "prompt": "A pattern begins 5, 10, 15, __. Find the next value.", "answer": "20."}]}, {"section": "1.2.1", "title": "Introduction to Probability", "target": "I can identify favorable and total equally likely outcomes in a single experiment.", "stage": "FIRST_CHECK", "rung": "Foundation", "families": [{"id": "CC2-AP1-1-2-1-T02-R01", "category": "reasoning", "prompt": "A fair six-sided die is rolled. Explain why the chance of rolling a number greater than 4 is 2/6, not 2/4.", "answer": "There are 2 favorable outcomes (5,6) among all 6 equally likely outcomes; P=2/6=1/3."}, {"id": "CC2-AP1-1-2-1-T02-R02", "category": "reasoning", "prompt": "A bag has 3 green and 2 yellow identical counters. Explain how the total and favorable outcomes determine the chance of green.", "answer": "3 favorable out of 5 equally likely counters; P(green)=3/5."}, {"id": "CC2-AP1-1-2-1-T02-R03", "category": "reasoning", "prompt": "A spinner has 8 equal sections labeled 1 to 8. Compare P(odd) and P(number > 6), explaining denominators.", "answer": "P(odd)=4/8; P(>6)=2/8; odd is twice as likely and both denominators are 8."}, {"id": "CC2-AP1-1-2-1-T02-S01", "category": "direct", "prompt": "A fair coin is flipped. Write P(heads).", "answer": "1/2."}, {"id": "CC2-AP1-1-2-1-T02-S02", "category": "direct", "prompt": "Roll a fair die. Write P(3).", "answer": "1/6."}, {"id": "CC2-AP1-1-2-1-T02-S03", "category": "direct", "prompt": "A bag contains 4 blue and 6 red identical chips. Write P(blue).", "answer": "4/10=2/5."}, {"id": "CC2-AP1-1-2-1-T02-P01", "category": "spiral", "prompt": "Simplify 4/12.", "answer": "1/3."}, {"id": "CC2-AP1-1-2-1-T02-P02", "category": "spiral", "prompt": "Find 25% of 20.", "answer": "5."}, {"id": "CC2-AP1-1-2-1-T02-P03", "category": "spiral", "prompt": "Write 1/2 as a percent.", "answer": "50%."}]}, {"section": "1.2.2", "title": "Investigating Probability", "target": "I can distinguish likely, unlikely, certain, and impossible events and express simple probabilities as fractions.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP1-1-2-2-T03-R01", "category": "reasoning", "prompt": "A jar holds 7 black and 3 white chips. Is drawing black likely or unlikely? Justify with a fraction.", "answer": "Likely; 7 of 10 equally likely chips are black, P=7/10>1/2."}, {"id": "CC2-AP1-1-2-2-T03-R02", "category": "reasoning", "prompt": "A fair number cube has faces 1–6. Classify rolling a 9, an even number, and a number below 7. Explain.", "answer": "9 impossible (0/6); even 3/6, equally likely as not; below 7 certain (6/6)."}, {"id": "CC2-AP1-1-2-2-T03-R03", "category": "reasoning", "prompt": "A spinner has 12 equal sections, 2 blue and 10 red. A student calls blue “likely.” Correct the claim.", "answer": "Blue is unlikely because P(blue)=2/12=1/6."}, {"id": "CC2-AP1-1-2-2-T03-S01", "category": "direct", "prompt": "A bag has 5 yellow and 1 purple chip. Find P(purple).", "answer": "1/6."}, {"id": "CC2-AP1-1-2-2-T03-S02", "category": "direct", "prompt": "Roll a fair die. Find P(number \u003c 5).", "answer": "4/6=2/3."}, {"id": "CC2-AP1-1-2-2-T03-S03", "category": "direct", "prompt": "Classify choosing a weekday from a set of seven cards labeled Monday–Sunday as certain, likely, unlikely, or impossible.", "answer": "Likely, with probability 5/7."}, {"id": "CC2-AP1-1-2-2-T03-P01", "category": "spiral", "prompt": "Write 3/4 as a percent.", "answer": "75%."}, {"id": "CC2-AP1-1-2-2-T03-P02", "category": "spiral", "prompt": "What is the complement of 2/5?", "answer": "3/5."}, {"id": "CC2-AP1-1-2-2-T03-P03", "category": "spiral", "prompt": "Simplify 6/9.", "answer": "2/3."}]}, {"section": "1.2.3", "title": "Modifying the Sample Space", "target": "I can explain how adding or removing possible outcomes changes the probability of a simple event.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Developing", "families": [{"id": "CC2-AP1-1-2-3-T04-R01", "category": "reasoning", "prompt": "A bag has 2 blue and 3 red chips. Add 2 red chips. Explain what happens to P(blue).", "answer": "P(blue) falls from 2/5 to 2/7; favorable blue stays 2, total increases."}, {"id": "CC2-AP1-1-2-3-T04-R02", "category": "reasoning", "prompt": "A spinner has 4 red and 4 green equal sectors. One green sector becomes red. Explain how P(red) changes.", "answer": "It rises from 4/8=1/2 to 5/8."}, {"id": "CC2-AP1-1-2-3-T04-R03", "category": "reasoning", "prompt": "A jar has 5 gold and 5 silver counters. Remove 3 silver counters. Explain whether gold is now more likely than before.", "answer": "Yes; P(gold) rises from 5/10 to 5/7."}, {"id": "CC2-AP1-1-2-3-T04-S01", "category": "direct", "prompt": "A bag has 3 red and 2 blue chips. Add 1 red chip. Find the new P(red).", "answer": "4/6=2/3."}, {"id": "CC2-AP1-1-2-3-T04-S02", "category": "direct", "prompt": "A set has 4 equally likely winning and 6 losing tickets. Remove 2 losing tickets. Find P(win).", "answer": "4/8=1/2."}, {"id": "CC2-AP1-1-2-3-T04-S03", "category": "direct", "prompt": "A spinner has 3 blue and 5 yellow equal sections. Recolor one yellow blue. Find P(blue).", "answer": "4/8=1/2."}, {"id": "CC2-AP1-1-2-3-T04-P01", "category": "spiral", "prompt": "Find 2/5 of 20.", "answer": "8."}, {"id": "CC2-AP1-1-2-3-T04-P02", "category": "spiral", "prompt": "Simplify 9/12.", "answer": "3/4."}, {"id": "CC2-AP1-1-2-3-T04-P03", "category": "spiral", "prompt": "Order 1/2 and 2/3 from least to greatest.", "answer": "1/2, 2/3."}]}, {"section": "1.2.7", "title": "Compound Probability", "target": "I can list outcomes from two simple experiments, recognizing that this is partial evidence of compound probability.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Developing", "families": [{"id": "CC2-AP1-1-2-7-T05-R01", "category": "reasoning", "prompt": "Flip a coin then choose a card labeled A or B. List all equally likely outcomes and explain the count.", "answer": "HA, HB, TA, TB; 2×2=4 outcomes."}, {"id": "CC2-AP1-1-2-7-T05-R02", "category": "reasoning", "prompt": "Spin a 1–3 spinner then flip a coin. Explain whether (2,H) is one of six outcomes.", "answer": "Yes: (1,H),(1,T),(2,H),(2,T),(3,H),(3,T); six."}, {"id": "CC2-AP1-1-2-7-T05-R03", "category": "reasoning", "prompt": "Choose red or green, then choose a number 1,2,3. Explain why an organized list needs six entries.", "answer": "2 colors ×3 numbers=6 possible ordered outcomes."}, {"id": "CC2-AP1-1-2-7-T05-S01", "category": "direct", "prompt": "Flip two coins. List all ordered results.", "answer": "HH, HT, TH, TT."}, {"id": "CC2-AP1-1-2-7-T05-S02", "category": "direct", "prompt": "Choose a letter A or B then digit 1 or 2. How many ordered outcomes?", "answer": "4."}, {"id": "CC2-AP1-1-2-7-T05-S03", "category": "direct", "prompt": "Roll a 1–4 die then flip a coin. How many ordered outcomes?", "answer": "8."}, {"id": "CC2-AP1-1-2-7-T05-P01", "category": "spiral", "prompt": "Find P(heads) for one fair coin toss.", "answer": "1/2."}, {"id": "CC2-AP1-1-2-7-T05-P02", "category": "spiral", "prompt": "Simplify 4/8.", "answer": "1/2."}, {"id": "CC2-AP1-1-2-7-T05-P03", "category": "spiral", "prompt": "Complete 3, 6, 9, __.", "answer": "12."}]}]}, {"chapter": 2, "title": "Fractions and Integer Addition", "sections": [{"section": "2.1.2", "title": "Rewriting Decimals as Fractions", "target": "I can rewrite equivalent fractions and decimals and justify their value.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Prerequisite", "families": [{"id": "CC2-AP2-2-1-2-T01-R01", "category": "reasoning", "prompt": "Explain why 0.375 and 3/8 describe the same number using thousandths or division.", "answer": "0.375=375/1000=3/8 after dividing by 125."}, {"id": "CC2-AP2-2-1-2-T01-R02", "category": "reasoning", "prompt": "A student writes 0.6=6/100. Explain the place-value error.", "answer": "0.6 is six tenths: 6/10=3/5, not six hundredths."}, {"id": "CC2-AP2-2-1-2-T01-R03", "category": "reasoning", "prompt": "Which is greater, 0.35 or 1/3? Explain using decimals.", "answer": "0.35>0.333...=1/3."}, {"id": "CC2-AP2-2-1-2-T01-S01", "category": "direct", "prompt": "Write 0.45 as a simplified fraction.", "answer": "9/20."}, {"id": "CC2-AP2-2-1-2-T01-S02", "category": "direct", "prompt": "Write 7/20 as a decimal.", "answer": "0.35."}, {"id": "CC2-AP2-2-1-2-T01-S03", "category": "direct", "prompt": "Write 1/8 as a decimal.", "answer": "0.125."}, {"id": "CC2-AP2-2-1-2-T01-P01", "category": "spiral", "prompt": "Simplify 12/18.", "answer": "2/3."}, {"id": "CC2-AP2-2-1-2-T01-P02", "category": "spiral", "prompt": "Find 25% of 64.", "answer": "16."}, {"id": "CC2-AP2-2-1-2-T01-P03", "category": "spiral", "prompt": "Write 3/4 as a decimal.", "answer": "0.75."}]}, {"section": "2.2.2", "title": "Adding Integers and Rational Numbers", "target": "I can add signed rational numbers and explain the result with a number line or zero pairs.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Developing", "families": [{"id": "CC2-AP2-2-2-2-T02-R01", "category": "reasoning", "prompt": "A diver starts at -3 m and rises 5 m. Explain the ending position with a signed addition model.", "answer": "-3+5=2 m; on a number line move five units right from -3."}, {"id": "CC2-AP2-2-2-2-T02-R02", "category": "reasoning", "prompt": "A student claims -4 + -3 = 7 because 4+3=7. Explain the error using direction.", "answer": "Both changes are negative; move seven left in total, so -7."}, {"id": "CC2-AP2-2-2-2-T02-R03", "category": "reasoning", "prompt": "Use zero pairs or a number line to justify -2.5 + 4.0.", "answer": "1.5; four units right from -2.5 ends at 1.5."}, {"id": "CC2-AP2-2-2-2-T02-S01", "category": "direct", "prompt": "Compute -6+9.", "answer": "3."}, {"id": "CC2-AP2-2-2-2-T02-S02", "category": "direct", "prompt": "Compute -1/2 + 3/4.", "answer": "1/4."}, {"id": "CC2-AP2-2-2-2-T02-S03", "category": "direct", "prompt": "Compute -2.5+(-1.25).", "answer": "-3.75."}, {"id": "CC2-AP2-2-2-2-T02-P01", "category": "spiral", "prompt": "Compute 5+(-2).", "answer": "3."}, {"id": "CC2-AP2-2-2-2-T02-P02", "category": "spiral", "prompt": "Order -3, 0, 2 from least to greatest.", "answer": "-3,0,2."}, {"id": "CC2-AP2-2-2-2-T02-P03", "category": "spiral", "prompt": "Find the opposite of -7.", "answer": "7."}]}, {"section": "2.2.3", "title": "More Addition of Integers and Rational Numbers", "target": "I can order positive and negative rational numbers and explain their positions on a number line.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Foundation", "families": [{"id": "CC2-AP2-2-2-3-T03-R01", "category": "reasoning", "prompt": "Order -0.7, -1/4, 0, 0.6 and explain why -0.7 is least.", "answer": "-0.7,-1/4,0,0.6; -0.7 is farthest left."}, {"id": "CC2-AP2-2-2-3-T03-R02", "category": "reasoning", "prompt": "Compare -3/5 and -0.8. Explain without ignoring the negative signs.", "answer": "-3/5=-0.6>-0.8 because -0.6 lies to the right."}, {"id": "CC2-AP2-2-2-3-T03-R03", "category": "reasoning", "prompt": "A student says -4 is greater than -2 because 4>2. Identify and correct the reasoning.", "answer": "-4\u003c-2; on a number line -4 lies farther left."}, {"id": "CC2-AP2-2-2-3-T03-S01", "category": "direct", "prompt": "Which is greater: -0.35 or -0.5?", "answer": "-0.35."}, {"id": "CC2-AP2-2-2-3-T03-S02", "category": "direct", "prompt": "Write the opposite of 3/4.", "answer": "-3/4."}, {"id": "CC2-AP2-2-2-3-T03-S03", "category": "direct", "prompt": "Order -2, 1/2, -1/2.", "answer": "-2,-1/2,1/2."}, {"id": "CC2-AP2-2-2-3-T03-P01", "category": "spiral", "prompt": "Compute -3+5.", "answer": "2."}, {"id": "CC2-AP2-2-2-3-T03-P02", "category": "spiral", "prompt": "Convert 1/4 to decimal.", "answer": "0.25."}, {"id": "CC2-AP2-2-2-3-T03-P03", "category": "spiral", "prompt": "Compare 0.4 and 2/5.", "answer": "Equal."}]}, {"section": "2.2.6", "title": "Multiplying Mixed Numbers", "target": "I can multiply positive fractions or mixed numbers and explain the grouping.", "stage": "READINESS", "rung": "Prerequisite", "families": [{"id": "CC2-AP2-2-2-6-T04-R01", "category": "reasoning", "prompt": "Explain with an area or partition model why 2/3 × 3/4 = 1/2.", "answer": "Six of twelve equal parts shaded by overlap, or 6/12=1/2."}, {"id": "CC2-AP2-2-2-6-T04-R02", "category": "reasoning", "prompt": "A recipe uses 1 1/2 cups per batch. Explain the amount for 2 1/3 batches.", "answer": "3/2×7/3=7/2=3 1/2 cups."}, {"id": "CC2-AP2-2-2-6-T04-R03", "category": "reasoning", "prompt": "A student multiplies 2/3 by 3/5 and gets 6/8. Identify the denominator mistake.", "answer": "Multiply denominators too: 2×3/(3×5)=6/15=2/5."}, {"id": "CC2-AP2-2-2-6-T04-S01", "category": "direct", "prompt": "Compute 2/5 × 3/4.", "answer": "3/10."}, {"id": "CC2-AP2-2-2-6-T04-S02", "category": "direct", "prompt": "Compute 1 1/2 × 2/3.", "answer": "1."}, {"id": "CC2-AP2-2-2-6-T04-S03", "category": "direct", "prompt": "Compute 3/8 × 4.", "answer": "1 1/2."}, {"id": "CC2-AP2-2-2-6-T04-P01", "category": "spiral", "prompt": "Write 1 1/4 as an improper fraction.", "answer": "5/4."}, {"id": "CC2-AP2-2-2-6-T04-P02", "category": "spiral", "prompt": "Compute 1/2 + 1/4.", "answer": "3/4."}, {"id": "CC2-AP2-2-2-6-T04-P03", "category": "spiral", "prompt": "Simplify 8/12.", "answer": "2/3."}]}, {"section": "2.3.2", "title": "More Graph Scaling", "target": "I can plot ordered pairs from a table using sensible axes and scale labels.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Foundation", "families": [{"id": "CC2-AP2-2-3-2-T05-R01", "category": "reasoning", "prompt": "A table pairs time 0,2,4 hours with distance 0,10,20 miles. Choose and justify axis labels and scales, then plot the points.", "answer": "x=time (hours), e.g. 0,1,2,3,4; y=distance (miles), e.g. 0,5,10,15,20. Plot (0,0),(2,10),(4,20)."}, {"id": "CC2-AP2-2-3-2-T05-R02", "category": "reasoning", "prompt": "A graph has y-values 0,25,50,75. Explain why marking every tick as 1 would be misleading without enough space.", "answer": "Use a constant scale such as increments of 25; axes must show values clearly."}, {"id": "CC2-AP2-2-3-2-T05-R03", "category": "reasoning", "prompt": "A student plots (3,8) by moving up 3 and right 8. Explain the coordinate error.", "answer": "Move right 3 (x), up 8 (y)."}, {"id": "CC2-AP2-2-3-2-T05-S01", "category": "direct", "prompt": "Plot (1,4), (2,8), (3,12) with x=number of tickets and y=dollars. State one useful y-axis increment.", "answer": "4 dollars per tick works; points as given."}, {"id": "CC2-AP2-2-3-2-T05-S02", "category": "direct", "prompt": "Which axis represents the independent variable in (hours, miles)?", "answer": "Horizontal x-axis (hours)."}, {"id": "CC2-AP2-2-3-2-T05-S03", "category": "direct", "prompt": "The points (0,0),(5,20),(10,40) must fit. Give a sensible x- and y-axis maximum.", "answer": "At least 10 on x and 40 on y, with uniform increments."}, {"id": "CC2-AP2-2-3-2-T05-P01", "category": "spiral", "prompt": "State the coordinates of a point 2 right and 5 up from origin.", "answer": "(2,5)."}, {"id": "CC2-AP2-2-3-2-T05-P02", "category": "spiral", "prompt": "Find 3 × 7.", "answer": "21."}, {"id": "CC2-AP2-2-3-2-T05-P03", "category": "spiral", "prompt": "Complete 4:6=8:__.", "answer": "12."}]}]}, {"chapter": 3, "title": "Arithmetic Properties", "sections": [{"section": "3.1.2", "title": "Identifying Terms in Expressions", "target": "I can use parentheses, operation order, and number properties to evaluate numerical expressions.", "stage": "READINESS", "rung": "Prerequisite", "families": [{"id": "CC2-AP3-3-1-2-T01-R01", "category": "reasoning", "prompt": "Compare 4+3×5 with (4+3)×5. Explain the different results.", "answer": "19 versus 35: multiplication first unless parentheses change grouping."}, {"id": "CC2-AP3-3-1-2-T01-R02", "category": "reasoning", "prompt": "A student writes 12-4÷2=4. Explain and correct the operation order.", "answer": "Divide first: 12-2=10."}, {"id": "CC2-AP3-3-1-2-T01-R03", "category": "reasoning", "prompt": "Show that 6(10+2)=6×10+6×2 without naming variable properties yet.", "answer": "72=60+12=72; distribute 6 to each addend."}, {"id": "CC2-AP3-3-1-2-T01-S01", "category": "direct", "prompt": "Evaluate 5+2(7-3).", "answer": "13."}, {"id": "CC2-AP3-3-1-2-T01-S02", "category": "direct", "prompt": "Evaluate 24÷(2×3).", "answer": "4."}, {"id": "CC2-AP3-3-1-2-T01-S03", "category": "direct", "prompt": "Evaluate 9-2×4.", "answer": "1."}, {"id": "CC2-AP3-3-1-2-T01-P01", "category": "spiral", "prompt": "Compute 3×(4+1).", "answer": "15."}, {"id": "CC2-AP3-3-1-2-T01-P02", "category": "spiral", "prompt": "Find the opposite of -6.", "answer": "6."}, {"id": "CC2-AP3-3-1-2-T01-P03", "category": "spiral", "prompt": "Simplify 12/16.", "answer": "3/4."}]}, {"section": "3.2.2", "title": "Connecting Addition and Subtraction", "target": "I can add and subtract signed rational numbers using models and inverse reasoning.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP3-3-2-2-T02-R01", "category": "reasoning", "prompt": "A temperature changes from -2.5°C to 3°C. Explain the change with subtraction and a number line.", "answer": "3-(-2.5)=5.5°C rise; subtraction of a negative adds 2.5."}, {"id": "CC2-AP3-3-2-2-T02-R02", "category": "reasoning", "prompt": "A student computes -3-(-4)=-7. Identify the mistake with a model.", "answer": "Subtracting -4 is adding 4: -3+4=1."}, {"id": "CC2-AP3-3-2-2-T02-R03", "category": "reasoning", "prompt": "Explain why 1/2-(-3/4) is larger than 1/2.", "answer": "Removing a negative adds: 1/2+3/4=5/4=1 1/4."}, {"id": "CC2-AP3-3-2-2-T02-S01", "category": "direct", "prompt": "Compute -5-(-2).", "answer": "-3."}, {"id": "CC2-AP3-3-2-2-T02-S02", "category": "direct", "prompt": "Compute -1/4 + 5/8.", "answer": "3/8."}, {"id": "CC2-AP3-3-2-2-T02-S03", "category": "direct", "prompt": "Compute 2.5-(-1.75).", "answer": "4.25."}, {"id": "CC2-AP3-3-2-2-T02-P01", "category": "spiral", "prompt": "Compute -3+7.", "answer": "4."}, {"id": "CC2-AP3-3-2-2-T02-P02", "category": "spiral", "prompt": "Order -1/2,0,-1.", "answer": "-1,-1/2,0."}, {"id": "CC2-AP3-3-2-2-T02-P03", "category": "spiral", "prompt": "Convert 0.25 to fraction.", "answer": "1/4."}]}, {"section": "3.3.1", "title": "Division with Rational Numbers", "target": "I can multiply and divide signed rational numbers and justify the sign with patterns or properties.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP3-3-3-1-T03-R01", "category": "reasoning", "prompt": "Explain why (-3/4)×(-8/9) must be positive and compute it.", "answer": "Two negative factors yield a positive; 24/36=2/3."}, {"id": "CC2-AP3-3-3-1-T03-R02", "category": "reasoning", "prompt": "A student claims (-2.4)÷0.6=4. Explain why the sign must be negative.", "answer": "Different signs give a negative quotient; 2.4÷0.6=4, so -4."}, {"id": "CC2-AP3-3-3-1-T03-R03", "category": "reasoning", "prompt": "Use a pattern (-2)×3,(-2)×2,(-2)×1,(-2)×0 to infer (-2)×(-1).", "answer": "-6,-4,-2,0, then +2; (-2)×(-1)=2."}, {"id": "CC2-AP3-3-3-1-T03-S01", "category": "direct", "prompt": "Compute (-5/6)÷(5/3).", "answer": "-1/2."}, {"id": "CC2-AP3-3-3-1-T03-S02", "category": "direct", "prompt": "Compute (-0.8)×(-0.5).", "answer": "0.4."}, {"id": "CC2-AP3-3-3-1-T03-S03", "category": "direct", "prompt": "Compute (-7)×(3/7).", "answer": "-3."}, {"id": "CC2-AP3-3-3-1-T03-P01", "category": "spiral", "prompt": "Compute -18÷3.", "answer": "-6."}, {"id": "CC2-AP3-3-3-1-T03-P02", "category": "spiral", "prompt": "Compute -1/2+3/4.", "answer": "1/4."}, {"id": "CC2-AP3-3-3-1-T03-P03", "category": "spiral", "prompt": "Compute 2×(-5).", "answer": "-10."}]}, {"section": "3.3.3", "title": "Arithmetic Properties", "target": "I can calculate with fractions, decimals, and signed numbers and justify the order and signs.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP3-3-3-3-T04-R01", "category": "reasoning", "prompt": "Evaluate -1.2÷0.3+(-3/4)(-8) and justify signs.", "answer": "-4+6=2; negative÷positive is negative, negative×negative is positive."}, {"id": "CC2-AP3-3-3-3-T04-R02", "category": "reasoning", "prompt": "A student does (-2)^2=-4. Explain the mistake and calculate (-2)^2 - 3.", "answer": "(-2)^2=4, so 4-3=1; exponent applies to grouped -2."}, {"id": "CC2-AP3-3-3-3-T04-R03", "category": "reasoning", "prompt": "Explain why (5/6-3/2)÷(-2/3) is positive, then calculate.", "answer": "5/6-9/6=-2/3; dividing by -2/3 gives 1."}, {"id": "CC2-AP3-3-3-3-T04-S01", "category": "direct", "prompt": "Compute -6+3(2-5).", "answer": "-15."}, {"id": "CC2-AP3-3-3-3-T04-S02", "category": "direct", "prompt": "Compute (-3/4)×(-8)+1.", "answer": "7."}, {"id": "CC2-AP3-3-3-3-T04-S03", "category": "direct", "prompt": "Compute 2.5-(-1/2)×4.", "answer": "4.5."}, {"id": "CC2-AP3-3-3-3-T04-P01", "category": "spiral", "prompt": "Compute 8÷(-2)+6.", "answer": "2."}, {"id": "CC2-AP3-3-3-3-T04-P02", "category": "spiral", "prompt": "Compute -1/2+1/4.", "answer": "-1/4."}, {"id": "CC2-AP3-3-3-3-T04-P03", "category": "spiral", "prompt": "Compute 3×(-4).", "answer": "-12."}]}, {"section": "3.3.3", "title": "Arithmetic Properties", "target": "I can solve a multistep signed-rational situation and interpret the result in context.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP3-3-3-3-T05-R01", "category": "reasoning", "prompt": "An account starts at -$12.50, has two charges of $4.75, then a $30 deposit. Find and interpret the ending balance.", "answer": "-12.50-2(4.75)+30=$8.00; the account ends $8 above zero."}, {"id": "CC2-AP3-3-3-3-T05-R02", "category": "reasoning", "prompt": "A submarine starts 4.5 m below sea level, rises 7 m, then descends 3.25 m. Explain the final position.", "answer": "-4.5+7-3.25=-0.75 m; 0.75 m below sea level."}, {"id": "CC2-AP3-3-3-3-T05-R03", "category": "reasoning", "prompt": "A game begins at -2.5 points, earns 3 rounds of 1.75 points, then loses 2.25. Interpret the score.", "answer": "-2.5+3(1.75)-2.25=0.5 point; finishes positive."}, {"id": "CC2-AP3-3-3-3-T05-S01", "category": "direct", "prompt": "A bank balance of -$5 receives $18 and pays $7.50. Find the balance.", "answer": "$5.50."}, {"id": "CC2-AP3-3-3-3-T05-S02", "category": "direct", "prompt": "The temperature is -3°C, rises 4.5°C, and falls 2°C. Find the final temperature.", "answer": "-0.5°C."}, {"id": "CC2-AP3-3-3-3-T05-S03", "category": "direct", "prompt": "An elevator starts at floor -2, rises 7 floors, then drops 3. Find the final floor.", "answer": "Floor 2."}, {"id": "CC2-AP3-3-3-3-T05-P01", "category": "spiral", "prompt": "Compute -4+9-3.", "answer": "2."}, {"id": "CC2-AP3-3-3-3-T05-P02", "category": "spiral", "prompt": "Compute 1/2+1/4.", "answer": "3/4."}, {"id": "CC2-AP3-3-3-3-T05-P03", "category": "spiral", "prompt": "What is the opposite of -6.5?", "answer": "6.5."}]}]}, {"chapter": 4, "title": "Proportions and Expressions", "sections": [{"section": "4.1.2", "title": "Scale Drawings", "target": "I can use a stated scale factor to find corresponding lengths and explain the units.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Developing", "families": [{"id": "CC2-AP4-4-1-2-T01-R01", "category": "reasoning", "prompt": "A 4-cm map segment represents 20 km. Explain how 7 cm on the same map represents a real distance.", "answer": "20÷4=5 km per cm; 7×5=35 km."}, {"id": "CC2-AP4-4-1-2-T01-R02", "category": "reasoning", "prompt": "A rectangle 3 cm by 5 cm is enlarged by factor 2. Explain which dimensions and area change.", "answer": "Dimensions 6 cm by 10 cm; area becomes 60 cm² (4× original 15 cm²)."}, {"id": "CC2-AP4-4-1-2-T01-R03", "category": "reasoning", "prompt": "A student says reducing a 12-cm segment by factor 1/3 gives 36 cm. Correct the claim.", "answer": "12×1/3=4 cm; reduction makes the length smaller."}, {"id": "CC2-AP4-4-1-2-T01-S01", "category": "direct", "prompt": "Scale 8 cm by factor 3/2.", "answer": "12 cm."}, {"id": "CC2-AP4-4-1-2-T01-S02", "category": "direct", "prompt": "At 1 cm:4 km, what does 6 cm represent?", "answer": "24 km."}, {"id": "CC2-AP4-4-1-2-T01-S03", "category": "direct", "prompt": "A 15-cm drawing is reduced by factor 2/5. Find new length.", "answer": "6 cm."}, {"id": "CC2-AP4-4-1-2-T01-P01", "category": "spiral", "prompt": "Simplify 6:9.", "answer": "2:3."}, {"id": "CC2-AP4-4-1-2-T01-P02", "category": "spiral", "prompt": "Find 25% of 80.", "answer": "20."}, {"id": "CC2-AP4-4-1-2-T01-P03", "category": "spiral", "prompt": "Compute 3/4×8.", "answer": "6."}]}, {"section": "4.2.2", "title": "Proportional Relationships with Tables and Graphs", "target": "I can decide whether a table is proportional by comparing output-to-input ratios.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP4-4-2-2-T02-R01", "category": "reasoning", "prompt": "Table: (1,3),(2,6),(4,12). Explain what makes it proportional and interpret (4,12).", "answer": "y/x=3 throughout; four input units correspond to twelve output units."}, {"id": "CC2-AP4-4-2-2-T02-R02", "category": "reasoning", "prompt": "Compare (1,4),(2,8),(3,13). Explain why the pattern is not proportional.", "answer": "Ratios 4,4,13/3 differ; (3,12) would fit y=4x."}, {"id": "CC2-AP4-4-2-2-T02-R03", "category": "reasoning", "prompt": "A student says (0,2),(1,5),(2,8) is proportional because y increases by 3. Explain the difference between constant difference and ratio.", "answer": "It is linear but not proportional; it does not pass through (0,0) and y/x is not constant."}, {"id": "CC2-AP4-4-2-2-T02-S01", "category": "direct", "prompt": "Are (2,10),(3,15),(5,25) proportional?", "answer": "Yes; y/x=5."}, {"id": "CC2-AP4-4-2-2-T02-S02", "category": "direct", "prompt": "For (1,2),(2,5),(3,6), is y/x constant?", "answer": "No."}, {"id": "CC2-AP4-4-2-2-T02-S03", "category": "direct", "prompt": "Complete proportional table: x=2,4,6; y=7,14,__.", "answer": "21."}, {"id": "CC2-AP4-4-2-2-T02-P01", "category": "spiral", "prompt": "Compute 12÷3.", "answer": "4."}, {"id": "CC2-AP4-4-2-2-T02-P02", "category": "spiral", "prompt": "Simplify 8:12.", "answer": "2:3."}, {"id": "CC2-AP4-4-2-2-T02-P03", "category": "spiral", "prompt": "Plot point two right, five up; give coordinates.", "answer": "(2,5)."}]}, {"section": "4.2.3", "title": "Unit Rate and Proportional Equations", "target": "I can complete ratio tables and interpret the unit rate with correct units.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP4-4-2-3-T03-R01", "category": "reasoning", "prompt": "Four cups of mix serve six people. Create a table for 6,12,18 people and explain cups per person.", "answer": "4,8,12 cups; 4/6=2/3 cup per person."}, {"id": "CC2-AP4-4-2-3-T03-R02", "category": "reasoning", "prompt": "A bicycle travels 45 miles in 3 hours. Explain how the unit rate predicts travel in 5 hours.", "answer": "15 miles/hour; 75 miles in 5 hours at same rate."}, {"id": "CC2-AP4-4-2-3-T03-R03", "category": "reasoning", "prompt": "A student divides $18 by 6 apples and says 1/3 apple per dollar is the cost per apple. Explain unit order.", "answer": "$18÷6 apples=$3/apple; reversing gives apples/dollar, a different rate."}, {"id": "CC2-AP4-4-2-3-T03-S01", "category": "direct", "prompt": "Five tickets cost $30. Find cost per ticket.", "answer": "$6/ticket."}, {"id": "CC2-AP4-4-2-3-T03-S02", "category": "direct", "prompt": "Complete: 3 notebooks cost $12; 9 cost $__.", "answer": "$36."}, {"id": "CC2-AP4-4-2-3-T03-S03", "category": "direct", "prompt": "Travel 72 km in 4 h. Give speed.", "answer": "18 km/h."}, {"id": "CC2-AP4-4-2-3-T03-P01", "category": "spiral", "prompt": "Compute 24÷6.", "answer": "4."}, {"id": "CC2-AP4-4-2-3-T03-P02", "category": "spiral", "prompt": "Simplify 9:12.", "answer": "3:4."}, {"id": "CC2-AP4-4-2-3-T03-P03", "category": "spiral", "prompt": "Complete 2:5=6:__.", "answer": "15."}]}, {"section": "4.2.4", "title": "Connecting Representations of Proportional Relationships", "target": "I can represent a proportional relationship with a table, a graph through the origin, and y=kx.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP4-4-2-4-T04-R01", "category": "reasoning", "prompt": "A taxi-less bicycle rental costs $6 per hour with no starting fee. Make a table for 0,1,2,3 hours, graph it, and give y=kx.", "answer": "y=6x; table cost 0,6,12,18; line through (0,0),(1,6),(2,12),(3,18)."}, {"id": "CC2-AP4-4-2-4-T04-R02", "category": "reasoning", "prompt": "A table gives (0,0),(2,9),(4,18). Explain the equation and what (4,18) means if x is pounds and y is cost.", "answer": "y=4.5x; four pounds cost $18."}, {"id": "CC2-AP4-4-2-4-T04-R03", "category": "reasoning", "prompt": "A student graphs (1,4),(2,8),(3,12) but draws a line through (0,2). Explain why the graph is inconsistent.", "answer": "A proportional graph y=4x goes through (0,0), not (0,2)."}, {"id": "CC2-AP4-4-2-4-T04-S01", "category": "direct", "prompt": "Find k if y=20 at x=5 in y=kx.", "answer": "k=4."}, {"id": "CC2-AP4-4-2-4-T04-S02", "category": "direct", "prompt": "Write equation for proportional pairs (3,15),(5,25).", "answer": "y=5x."}, {"id": "CC2-AP4-4-2-4-T04-S03", "category": "direct", "prompt": "Complete table y=2.5x for x=0,2,4.", "answer": "0,5,10."}, {"id": "CC2-AP4-4-2-4-T04-P01", "category": "spiral", "prompt": "Find unit rate $21 for 7 items.", "answer": "$3/item."}, {"id": "CC2-AP4-4-2-4-T04-P02", "category": "spiral", "prompt": "Is y=3x+2 proportional?", "answer": "No, nonzero intercept."}, {"id": "CC2-AP4-4-2-4-T04-P03", "category": "spiral", "prompt": "Simplify 6:15.", "answer": "2:5."}]}, {"section": "4.3.1", "title": "Combining Like Terms", "target": "I can combine like terms and evaluate simple expressions correctly.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP4-4-3-1-T05-R01", "category": "reasoning", "prompt": "Explain why 5x+3+2x-8 simplifies to 7x-5, not 10x.", "answer": "Like variable terms 5x+2x=7x, constants 3-8=-5; unlike terms do not combine."}, {"id": "CC2-AP4-4-3-1-T05-R02", "category": "reasoning", "prompt": "A student combines 4a+3b into 7ab. Explain the error.", "answer": "Unlike terms a and b cannot combine; 4a+3b remains."}, {"id": "CC2-AP4-4-3-1-T05-R03", "category": "reasoning", "prompt": "Simplify 3y-5+2y+8 and evaluate at y=-2; show both steps.", "answer": "5y+3, then 5(-2)+3=-7."}, {"id": "CC2-AP4-4-3-1-T05-S01", "category": "direct", "prompt": "Simplify 7x-2x+4.", "answer": "5x+4."}, {"id": "CC2-AP4-4-3-1-T05-S02", "category": "direct", "prompt": "Evaluate 2a+3 when a=-4.", "answer": "-5."}, {"id": "CC2-AP4-4-3-1-T05-S03", "category": "direct", "prompt": "Simplify 4m+5-6m-1.", "answer": "-2m+4."}, {"id": "CC2-AP4-4-3-1-T05-P01", "category": "spiral", "prompt": "Evaluate 6-2×3.", "answer": "0."}, {"id": "CC2-AP4-4-3-1-T05-P02", "category": "spiral", "prompt": "Compute -5+8.", "answer": "3."}, {"id": "CC2-AP4-4-3-1-T05-P03", "category": "spiral", "prompt": "Write 3(2+4) as a number.", "answer": "18."}]}, {"section": "4.3.3", "title": "Simplifying With Zero", "target": "I can distribute positive and negative factors, combine terms, and prove expression equivalence.", "stage": "INDEPENDENT_NEGATIVE_FACTOR_CHECK", "rung": "Proficient", "families": [{"id": "CC2-AP4-4-3-3-T06-R01", "category": "reasoning", "prompt": "Explain each product in -3(2x-5) and simplify; why does the constant become positive?", "answer": "-6x+15; (-3)×(-5)=+15."}, {"id": "CC2-AP4-4-3-3-T06-R02", "category": "reasoning", "prompt": "A student says -2(3y-1)+4y=-2y-2. Decide whether the claim is true for every y and prove it algebraically.", "answer": "False; -6y+2+4y=-2y+2, not -2y-2."}, {"id": "CC2-AP4-4-3-3-T06-R03", "category": "reasoning", "prompt": "Prove 4(2x-3)-3x and 5x-12 are equivalent for all x.", "answer": "Distribute: 8x-12-3x=5x-12 for every x."}, {"id": "CC2-AP4-4-3-3-T06-S01", "category": "direct", "prompt": "Expand -2(4a-3).", "answer": "-8a+6."}, {"id": "CC2-AP4-4-3-3-T06-S02", "category": "direct", "prompt": "Simplify 3(2x-5)-x.", "answer": "5x-15."}, {"id": "CC2-AP4-4-3-3-T06-S03", "category": "direct", "prompt": "Simplify -(2y+7)+5y.", "answer": "3y-7."}, {"id": "CC2-AP4-4-3-3-T06-P01", "category": "spiral", "prompt": "Combine 4x+3x.", "answer": "7x."}, {"id": "CC2-AP4-4-3-3-T06-P02", "category": "spiral", "prompt": "Evaluate 2(3+4).", "answer": "14."}, {"id": "CC2-AP4-4-3-3-T06-P03", "category": "spiral", "prompt": "Compute -3×(-5).", "answer": "15."}]}]}, {"chapter": 5, "title": "Probability and Solving Word Problems", "sections": [{"section": "5.1.2", "title": "Finding and Using Percentages", "target": "I can find a percent of a quantity or an unknown whole from a part-to-whole model.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Prerequisite", "families": [{"id": "CC2-AP5-5-1-2-T01-R01", "category": "reasoning", "prompt": "In a class of 30, 40% chose blue. Explain the part and whole and find the number.", "answer": "Whole 30; part 0.40×30=12."}, {"id": "CC2-AP5-5-1-2-T01-R02", "category": "reasoning", "prompt": "Nine students are 25% of a club. Explain how to find the whole without assuming it is 25.", "answer": "Whole=9÷0.25=36 members."}, {"id": "CC2-AP5-5-1-2-T01-R03", "category": "reasoning", "prompt": "A student says 20% of 60 is 20 students. Correct using a model.", "answer": "20% means 20 per 100, so 0.2×60=12."}, {"id": "CC2-AP5-5-1-2-T01-S01", "category": "direct", "prompt": "Find 15% of 80.", "answer": "12."}, {"id": "CC2-AP5-5-1-2-T01-S02", "category": "direct", "prompt": "If 12 is 30% of a number, find that number.", "answer": "40."}, {"id": "CC2-AP5-5-1-2-T01-S03", "category": "direct", "prompt": "Convert 0.35 to a percent.", "answer": "35%."}, {"id": "CC2-AP5-5-1-2-T01-P01", "category": "spiral", "prompt": "Simplify 6/8.", "answer": "3/4."}, {"id": "CC2-AP5-5-1-2-T01-P02", "category": "spiral", "prompt": "Find 1/4 of 20.", "answer": "5."}, {"id": "CC2-AP5-5-1-2-T01-P03", "category": "spiral", "prompt": "Compute 3×12.", "answer": "36."}]}, {"section": "5.2.4", "title": "Probability Tables", "target": "I can list or tabulate all ordered outcomes of two simple experiments.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP5-5-2-4-T02-R01", "category": "reasoning", "prompt": "Flip a fair coin then spin a 1–3 spinner. Organize all outcomes, and explain why there are six.", "answer": "H1,H2,H3,T1,T2,T3: 2×3=6 equally likely ordered outcomes."}, {"id": "CC2-AP5-5-2-4-T02-R02", "category": "reasoning", "prompt": "A cafeteria chooses 2 sandwiches and 3 drinks. Construct the complete list and defend that none is missing.", "answer": "S1D1,S1D2,S1D3,S2D1,S2D2,S2D3; six."}, {"id": "CC2-AP5-5-2-4-T02-R03", "category": "reasoning", "prompt": "A student lists HT and TH as the only outcomes of two coin flips. Explain the omitted outcomes.", "answer": "HH and TT are missing; all four ordered outcomes HH,HT,TH,TT."}, {"id": "CC2-AP5-5-2-4-T02-S01", "category": "direct", "prompt": "Two coins are flipped. How many ordered outcomes?", "answer": "4."}, {"id": "CC2-AP5-5-2-4-T02-S02", "category": "direct", "prompt": "Choose A,B,C then number 1 or 2. List all ordered outcomes.", "answer": "A1,A2,B1,B2,C1,C2."}, {"id": "CC2-AP5-5-2-4-T02-S03", "category": "direct", "prompt": "Roll a fair 1–4 spinner twice. How many ordered pairs?", "answer": "16."}, {"id": "CC2-AP5-5-2-4-T02-P01", "category": "spiral", "prompt": "List possible outcomes of one coin flip.", "answer": "H,T."}, {"id": "CC2-AP5-5-2-4-T02-P02", "category": "spiral", "prompt": "Compute 2×5.", "answer": "10."}, {"id": "CC2-AP5-5-2-4-T02-P03", "category": "spiral", "prompt": "Write 1/4 as a decimal.", "answer": "0.25."}]}, {"section": "5.2.5", "title": "Probability Trees", "target": "I can compute probabilities of single and two-stage events, explaining favorable and total outcomes.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP5-5-2-5-T03-R01", "category": "reasoning", "prompt": "Flip a fair coin twice. Explain why P(exactly one head)=2/4, not 1/4.", "answer": "HT and TH both qualify among HH,HT,TH,TT; probability 2/4=1/2."}, {"id": "CC2-AP5-5-2-5-T03-R02", "category": "reasoning", "prompt": "Roll a fair die and flip a coin. Explain P(even and heads).", "answer": "Even 2,4,6 combined with H gives 3 favorable of 12 equally likely outcomes: 1/4."}, {"id": "CC2-AP5-5-2-5-T03-R03", "category": "reasoning", "prompt": "Pick one of three equal color cards R,B,G and flip a coin. Explain P(B and T).", "answer": "One favorable (B,T) among 3×2=6; 1/6."}, {"id": "CC2-AP5-5-2-5-T03-S01", "category": "direct", "prompt": "Two fair coins are flipped. Find P(two heads).", "answer": "1/4."}, {"id": "CC2-AP5-5-2-5-T03-S02", "category": "direct", "prompt": "Two fair 1–4 spinners are spun. Find P(both 4).", "answer": "1/16."}, {"id": "CC2-AP5-5-2-5-T03-S03", "category": "direct", "prompt": "Flip a coin and roll a fair die. Find P(tails and 6).", "answer": "1/12."}, {"id": "CC2-AP5-5-2-5-T03-P01", "category": "spiral", "prompt": "Find P(odd) on fair die.", "answer": "1/2."}, {"id": "CC2-AP5-5-2-5-T03-P02", "category": "spiral", "prompt": "Simplify 3/6.", "answer": "1/2."}, {"id": "CC2-AP5-5-2-5-T03-P03", "category": "spiral", "prompt": "Compute 1/3×1/2.", "answer": "1/6."}]}, {"section": "5.2.6", "title": "Compound Events", "target": "I can use a complete tree/table to justify compound-event probabilities with and without replacement.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP5-5-2-6-T04-R01", "category": "reasoning", "prompt": "A bag holds 2 red and 3 blue chips. Draw twice with replacement. Explain P(two red).", "answer": "Each draw P(red)=2/5; 2/5×2/5=4/25. Replacement keeps five chips."}, {"id": "CC2-AP5-5-2-6-T04-R02", "category": "reasoning", "prompt": "The same bag has 2 red,3 blue. Draw twice without replacement. Explain P(two red).", "answer": "2/5×1/4=2/20=1/10; after first red only one red remains out of four."}, {"id": "CC2-AP5-5-2-6-T04-R03", "category": "reasoning", "prompt": "A student uses 1/2 for each color on a spinner with 3 red and 1 blue equal sectors. Explain why unequal color counts matter for two spins.", "answer": "P(red)=3/4, P(blue)=1/4; P(two blue)=1/16, not 1/4."}, {"id": "CC2-AP5-5-2-6-T04-S01", "category": "direct", "prompt": "Bag 3 green,2 orange. Without replacement, P(two orange)?", "answer": "2/5×1/4=1/10."}, {"id": "CC2-AP5-5-2-6-T04-S02", "category": "direct", "prompt": "Bag 1 red,3 blue. With replacement, P(two red)?", "answer": "1/16."}, {"id": "CC2-AP5-5-2-6-T04-S03", "category": "direct", "prompt": "Spinner has 2 green and 6 yellow equal sectors. Find P(two green) over independent spins.", "answer": "(2/8)^2=1/16."}, {"id": "CC2-AP5-5-2-6-T04-P01", "category": "spiral", "prompt": "Simplify 4/20.", "answer": "1/5."}, {"id": "CC2-AP5-5-2-6-T04-P02", "category": "spiral", "prompt": "Find 3/5 of 10.", "answer": "6."}, {"id": "CC2-AP5-5-2-6-T04-P03", "category": "spiral", "prompt": "How many total outcomes of two fair coin flips?", "answer": "4."}]}, {"section": "5.3.3", "title": "Strategies for Using the 5-D Process", "target": "I can define an unknown, organize data, and write an equation that models a word problem.", "stage": "FIRST_CHECK_PARTIAL", "rung": "Foundation", "families": [{"id": "CC2-AP5-5-3-3-T05-R01", "category": "reasoning", "prompt": "A ride costs $4 plus $3 per minute and totals $25. Define m, make a 2-row try/check table, and write the equation.", "answer": "m=minutes; 4+3m=25; m=7; sample checks m=5→19,m=7→25."}, {"id": "CC2-AP5-5-3-3-T05-R02", "category": "reasoning", "prompt": "Three identical notebooks plus a $2 pen cost $17. Explain what n means and write an equation.", "answer": "n=price of one notebook in dollars; 3n+2=17, n=5."}, {"id": "CC2-AP5-5-3-3-T05-R03", "category": "reasoning", "prompt": "A student writes 5x=24 for five tickets costing $24 including a $4 processing charge. Correct the model.", "answer": "5x+4=24; x=4 dollars/ticket."}, {"id": "CC2-AP5-5-3-3-T05-S01", "category": "direct", "prompt": "Write an equation: 4 packets each contain n items; together 28 items.", "answer": "4n=28."}, {"id": "CC2-AP5-5-3-3-T05-S02", "category": "direct", "prompt": "A fee of $6 plus $2 per mile totals $20. Write an equation.", "answer": "6+2m=20."}, {"id": "CC2-AP5-5-3-3-T05-S03", "category": "direct", "prompt": "Solve 3n+4=19.", "answer": "n=5."}, {"id": "CC2-AP5-5-3-3-T05-P01", "category": "spiral", "prompt": "Compute 4×6.", "answer": "24."}, {"id": "CC2-AP5-5-3-3-T05-P02", "category": "spiral", "prompt": "Find 20% of 50.", "answer": "10."}, {"id": "CC2-AP5-5-3-3-T05-P03", "category": "spiral", "prompt": "Complete x=1,2,3 for y=3x: y=__.", "answer": "3,6,9."}]}]}, {"chapter": 6, "title": "Solving Inequalities and Equations", "sections": [{"section": "6.1.4", "title": "Solving One Variable Inequalities", "target": "I can solve a two-step inequality, graph its solution set, and test a value.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP6-6-1-4-T01-R01", "category": "reasoning", "prompt": "Solve 3x+2>11. Explain the open endpoint and give one value that satisfies it.", "answer": "3x>9, x>3; open circle at 3 shaded right; x=4 works."}, {"id": "CC2-AP6-6-1-4-T01-R02", "category": "reasoning", "prompt": "A student solves -2x+1≤9 as x≤-4. Identify the sign reversal error.", "answer": "-2x≤8; dividing by -2 reverses inequality: x≥-4, closed at -4, shade right."}, {"id": "CC2-AP6-6-1-4-T01-R03", "category": "reasoning", "prompt": "Compare solutions 2x-5\u003c7 and 2x-5≤7. Explain the endpoint difference.", "answer": "x\u003c6 (open) and x≤6 (closed); both shade left."}, {"id": "CC2-AP6-6-1-4-T01-S01", "category": "direct", "prompt": "Solve 4x-3≥13.", "answer": "x≥4."}, {"id": "CC2-AP6-6-1-4-T01-S02", "category": "direct", "prompt": "Solve -3x\u003c12.", "answer": "x>-4."}, {"id": "CC2-AP6-6-1-4-T01-S03", "category": "direct", "prompt": "Does x=2 satisfy 2x+1\u003c6?", "answer": "Yes: 5\u003c6."}, {"id": "CC2-AP6-6-1-4-T01-P01", "category": "spiral", "prompt": "Solve 2x+3=11.", "answer": "x=4."}, {"id": "CC2-AP6-6-1-4-T01-P02", "category": "spiral", "prompt": "Compute -2×(-5).", "answer": "10."}, {"id": "CC2-AP6-6-1-4-T01-P03", "category": "spiral", "prompt": "Evaluate 3(2+1).", "answer": "9."}]}, {"section": "6.2.3", "title": "Solving Equations and Recording Work", "target": "I can solve a two-step equation and verify my solution by substitution.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Developing", "families": [{"id": "CC2-AP6-6-2-3-T02-R01", "category": "reasoning", "prompt": "Solve 3x+5=20 and explain why the check establishes equality.", "answer": "3x=15,x=5; 3(5)+5=20."}, {"id": "CC2-AP6-6-2-3-T02-R02", "category": "reasoning", "prompt": "A student solves 4x-7=13 as x=4. Identify the error and verify the correct value.", "answer": "4x=20,x=5; 4(5)-7=13."}, {"id": "CC2-AP6-6-2-3-T02-R03", "category": "reasoning", "prompt": "Solve -2x+9=1, then substitute in the original equation.", "answer": "-2x=-8,x=4; -2(4)+9=1."}, {"id": "CC2-AP6-6-2-3-T02-S01", "category": "direct", "prompt": "Solve 5x+2=27.", "answer": "x=5."}, {"id": "CC2-AP6-6-2-3-T02-S02", "category": "direct", "prompt": "Solve x/3-4=2.", "answer": "x=18."}, {"id": "CC2-AP6-6-2-3-T02-S03", "category": "direct", "prompt": "Solve -4x+3=15.", "answer": "x=-3."}, {"id": "CC2-AP6-6-2-3-T02-P01", "category": "spiral", "prompt": "Compute 3(-2)+6.", "answer": "0."}, {"id": "CC2-AP6-6-2-3-T02-P02", "category": "spiral", "prompt": "Simplify 5x+2x.", "answer": "7x."}, {"id": "CC2-AP6-6-2-3-T02-P03", "category": "spiral", "prompt": "Solve x+4=11.", "answer": "x=7."}]}, {"section": "6.2.6", "title": "Cases With Infinite or No Solutions", "target": "I can tell whether an equation has one solution, no solution, or all numbers as solutions.", "stage": "FIRST_CHECK", "rung": "Developing", "families": [{"id": "CC2-AP6-6-2-6-T03-R01", "category": "reasoning", "prompt": "Explain why 3(x+2)=3x+6 is true for every x.", "answer": "Distribute left: 3x+6=3x+6, an identity; all numbers."}, {"id": "CC2-AP6-6-2-6-T03-R02", "category": "reasoning", "prompt": "A student claims 2x+5=2x-1 has solution x=-3. Explain why no number works.", "answer": "Subtract 2x: 5=-1, a contradiction; no solution."}, {"id": "CC2-AP6-6-2-6-T03-R03", "category": "reasoning", "prompt": "Classify 4x+3=2x+11 and demonstrate its unique solution.", "answer": "2x=8,x=4; one solution."}, {"id": "CC2-AP6-6-2-6-T03-S01", "category": "direct", "prompt": "Classify 5x+2=5x+8.", "answer": "No solution."}, {"id": "CC2-AP6-6-2-6-T03-S02", "category": "direct", "prompt": "Classify 2(x+3)=2x+6.", "answer": "All real numbers."}, {"id": "CC2-AP6-6-2-6-T03-S03", "category": "direct", "prompt": "Solve 7x=21.", "answer": "One solution x=3."}, {"id": "CC2-AP6-6-2-6-T03-P01", "category": "spiral", "prompt": "Simplify 3(x+2).", "answer": "3x+6."}, {"id": "CC2-AP6-6-2-6-T03-P02", "category": "spiral", "prompt": "Compute 5-8.", "answer": "-3."}, {"id": "CC2-AP6-6-2-6-T03-P03", "category": "spiral", "prompt": "Solve x+1=7.", "answer": "x=6."}]}, {"section": "6.2.7", "title": "Choosing A Solving Strategy", "target": "I can independently solve multistep equations and inequalities, explaining equivalent steps.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP6-6-2-7-T04-R01", "category": "reasoning", "prompt": "Solve 3(2x-1)-5=16 and show each equivalent transformation.", "answer": "6x-3-5=16; 6x=24; x=4."}, {"id": "CC2-AP6-6-2-7-T04-R02", "category": "reasoning", "prompt": "Solve -2(3x-4)≥20; explain why inequality direction reverses at the last step.", "answer": "-6x+8≥20; -6x≥12; x≤-2; negative divisor reverses sign."}, {"id": "CC2-AP6-6-2-7-T04-R03", "category": "reasoning", "prompt": "A student writes 4(x-2)+3x=21→7x-2=21. Find the error and solve correctly.", "answer": "Distribute 4 to -2: 4x-8+3x=21; 7x=29; x=29/7."}, {"id": "CC2-AP6-6-2-7-T04-S01", "category": "direct", "prompt": "Solve 5x-2(x+3)=9.", "answer": "x=5."}, {"id": "CC2-AP6-6-2-7-T04-S02", "category": "direct", "prompt": "Solve 2(3x+1)\u003c20.", "answer": "x\u003c3."}, {"id": "CC2-AP6-6-2-7-T04-S03", "category": "direct", "prompt": "Solve -3(x-2)+5=20.", "answer": "x=-3."}, {"id": "CC2-AP6-6-2-7-T04-P01", "category": "spiral", "prompt": "Expand 2(x+4).", "answer": "2x+8."}, {"id": "CC2-AP6-6-2-7-T04-P02", "category": "spiral", "prompt": "Solve 3x+4=19.", "answer": "x=5."}, {"id": "CC2-AP6-6-2-7-T04-P03", "category": "spiral", "prompt": "Compute -21÷3.", "answer": "-7."}]}, {"section": "6.2.7", "title": "Choosing A Solving Strategy", "target": "I can write, solve, graph, and interpret equations and inequalities from real contexts.", "stage": "EXPECT_AFTER_FEEDBACK", "rung": "Proficient", "families": [{"id": "CC2-AP6-6-2-7-T05-R01", "category": "reasoning", "prompt": "A club costs $18 to join and $6 per visit. With at most $60, write and solve an inequality for visits; explain whole-number choices.", "answer": "18+6v≤60, v≤7; whole visits 0–7."}, {"id": "CC2-AP6-6-2-7-T05-R02", "category": "reasoning", "prompt": "A store charges $5 plus $4 per item. The total was $29. Define n, solve, and interpret the equation.", "answer": "5+4n=29; n=6 items."}, {"id": "CC2-AP6-6-2-7-T05-R03", "category": "reasoning", "prompt": "A student models a $45 budget, $9 flat fee, and $4 per ride by 9+4r≥45. Correct the inequality and interpret it.", "answer": "9+4r≤45; r≤9 rides, whole numbers 0–9."}, {"id": "CC2-AP6-6-2-7-T05-S01", "category": "direct", "prompt": "A cab charges $3 plus $2 per mile. Total $17. Write and solve an equation.", "answer": "3+2m=17; m=7 miles."}, {"id": "CC2-AP6-6-2-7-T05-S02", "category": "direct", "prompt": "A budget is $30. Each book costs $6. Write and solve maximum books inequality.", "answer": "6b≤30; b≤5 books."}, {"id": "CC2-AP6-6-2-7-T05-S03", "category": "direct", "prompt": "An amusement fee is $8 plus $5 per game. Write an inequality for at most $38.", "answer": "8+5g≤38; g≤6 whole games."}, {"id": "CC2-AP6-6-2-7-T05-P01", "category": "spiral", "prompt": "Solve 2x+5=17.", "answer": "x=6."}, {"id": "CC2-AP6-6-2-7-T05-P02", "category": "spiral", "prompt": "Solve 3x\u003c12.", "answer": "x\u003c4."}, {"id": "CC2-AP6-6-2-7-T05-P03", "category": "spiral", "prompt": "Find the unit rate of $20 for 4 items.", "answer": "$5/item."}]}]}];let C=0,T=0;const E=id=>document.getElementById(id);function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){E('chapters').innerHTML=data.map((x,i)=>`<button class="${i===C?'active':''}" onclick="C=${i};T=0;render()">Chapter ${x.chapter} — ${escape(x.title)}</button>`).join('');const d=data[C];E('targets').innerHTML=d.sections.map((x,i)=>`<button class="target ${i===T?'active':''}" onclick="T=${i};render()"><b>${escape(x.section)} · ${escape(x.title)}</b><div class="stage">${escape(x.stage)}</div></button>`).join('');const s=d.sections[T];E('heading').textContent=s.section+' · '+s.title;E('list').innerHTML=`<p>${escape(s.target)} · <span class="stage">${escape(s.rung)} / ${escape(s.stage)}</span></p>`+s.families.map(f=>`<article class="card"><div class="tag">${escape(f.category)} · ${escape(f.id)}</div><p class="prompt">${escape(f.prompt)}</p><details><summary>Teacher answer</summary><div class="answer">${escape(f.answer)}</div></details></article>`).join('');}render();</script></body></html>
